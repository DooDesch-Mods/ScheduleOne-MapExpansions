<link rel="stylesheet" href="app.css">

<div class="editor" id="editor">
  <div class="toolbar dock" id="toolbar">
    <div class="title">Karteneditor</div>
    <button class="tool" id="save">Speichern</button>
    <div class="status" id="status"></div>
    <div class="sep"></div>
    <button class="tool" id="mode-move">Verschieben W</button>
    <button class="tool" id="mode-rotate">Drehen E</button>
    <button class="tool" id="mode-scale">Skalieren R</button>
    <div class="sep"></div>
    <button class="tool" id="snap-grid">Raster 0,5 m</button>
    <button class="tool" id="snap-turn">15°</button>
    <button class="tool" id="snap-edges">Kanten</button>
    <div class="sep"></div>
    <button class="tool" id="undo">Rückgängig</button>
    <button class="tool" id="redo">Wiederholen</button>
    <button class="tool" id="play">Spielen Tab</button>
    <div class="sep"></div>
    <button class="tool" id="new-rule">Entfernen</button>
    <button class="tool" id="new-block">Blocker</button>
    <button class="tool" id="new-panel">Panel</button>
    <button class="tool" id="new-opening">Öffnung</button>
    <button class="tool" id="apply">Anwenden</button>
    <div class="spacer"></div>
    <button class="tool" id="close">Schließen</button>
  </div>
  <div class="middle">
    <div class="side dock" id="hierarchy">
      <div class="head">Hierarchie</div>
      <div class="list" id="list"></div>
    </div>
    <div class="viewport"></div>
    <div class="side dock" id="inspector">
      <div class="head">Inspektor</div>
      <div class="props" id="props"></div>
    </div>
  </div>
  <div class="bottom dock" id="bottom">
    <div class="catalog" id="catalog">
      <div class="head row">
        <div class="tabs" id="tabs"></div>
        <input class="field search" id="search" placeholder="Suchen">
        <div class="hint" id="cat-hint"></div>
      </div>
      <div class="results" id="results"></div>
    </div>
    <div class="console" id="console">
      <div class="head">Konsole</div>
      <div class="lines" id="lines"></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
